name: E2E

# The demo image is built once and started twice:
# 1. against the REAL Supertext API (secret SUPERTEXT_API_KEY): language list check and the
#    end-to-end test (tests/e2e), so language mapping and the live API's behaviour are tested;
# 2. for the docs screenshots (tests/docs), with the same secret, so the guides show real
#    Supertext translations (without the secret: the stand-in API). Version reports always go
#    to the stand-in. Changed images are committed to main.
# See "End-to-end tests" and "Docs screenshots" in docs/DEVELOPER.md.

on:
  workflow_dispatch:
  # A pull request that changes the E2E test itself runs it before merging.
  pull_request:
    paths:
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '48 5 * * 1' # Mondays, 05:48 UTC
  push:
    branches: [main]
    paths:
      - 'supertext/**'
      - 'composer.json'
      - 'demo/**'
      - 'tests/docs/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (live API) and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      images-changed: ${{ steps.images.outputs.changed }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # Two demos share the runner's network: each listens on its own PORT and has its own database.
      LIVE_URL: http://localhost:8081
      DOCS_URL: http://localhost:8082
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the demo image (cached between runs)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: demo/Dockerfile
          tags: supertext-prestashop-demo
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Demo accounts for this run only
        run: |
          for v in DEMO_ADMIN_PASSWORD DEMO_EDITOR_PASSWORD; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$v=$value" >> "$GITHUB_ENV"
          done
          {
            echo "DEMO_ADMIN_EMAIL=admin@e2e.example.com"
            echo "DEMO_EDITOR_EMAIL=editor@e2e.example.com"
          } >> "$GITHUB_ENV"

      - name: Install the test tools
        run: |
          (cd tests/e2e && npm ci --no-audit --no-fund)
          (cd tests/docs && npm ci --no-audit --no-fund)
          (cd tests/e2e && npx playwright install --with-deps chromium)

      # --- 1. Real Supertext API ----------------------------------------------------------
      - name: Check for the API key
        id: key
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
        run: |
          if [ -n "$SUPERTEXT_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret SUPERTEXT_API_KEY is not set: skipping the tests against the real Supertext API (see docs/DEVELOPER.md → End-to-end tests)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the demo against the real API
        if: steps.key.outputs.present == 'true'
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
        run: |
          # Version reports off: CI runs are no installations for the Commando Center.
          docker run -d --name demo-live --network host \
            -e PORT=8081 -e PRESTASHOP_DOMAIN=localhost:8081 -e DATABASE_URL -e PRESTASHOP_DB_NAME=prestashop_live \
            -e SUPERTEXT_API_KEY -e SUPERTEXT_VERSION_REPORTS=0 \
            -e DEMO_ADMIN_EMAIL -e DEMO_ADMIN_PASSWORD -e DEMO_EDITOR_EMAIL -e DEMO_EDITOR_PASSWORD \
            supertext-prestashop-demo
          # First start: PrestaShop's installer, then demo/setup.php; Apache starts after that.
          for _ in $(seq 1 180); do
            if curl -fsS -o /dev/null "$LIVE_URL/health"; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' demo-live)" != "true" ]; then docker logs demo-live; exit 1; fi
            sleep 5
          done
          curl -fsS -o /dev/null "$LIVE_URL/health" || { docker logs demo-live; exit 1; }

      - name: Language list against the real API
        if: steps.key.outputs.present == 'true'
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
          E2E_SOURCE: en
          E2E_TARGETS: de-CH,fr-CH,it-CH
        run: |
          node tests/e2e/features.mjs

      - name: End-to-end test against the real API
        if: steps.key.outputs.present == 'true'
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ env.LIVE_URL }}/admin-dev
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/prestashop_live
          EDITOR_EMAIL: ${{ env.DEMO_EDITOR_EMAIL }}
          EDITOR_PASSWORD: ${{ env.DEMO_EDITOR_PASSWORD }}
          E2E_TARGETS: de-CH,fr-CH,it-CH
        run: node live.mjs

      # --- 2. Docs screenshots with the real Supertext API -------------------------------
      - name: Screenshots with the real Supertext API
        id: shots
        if: success() || failure()
        env:
          LIVE_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
        run: |
          # The stand-in always takes the version reports; it translates only without the secret.
          (cd tests/docs && nohup node stand-in.mjs > stand-in.log 2>&1 &)
          # No SUPERTEXT_API_KEY in the container: the screenshot script enters the key (DOCS_API_KEY)
          # on the settings page.
          if [ -n "$LIVE_KEY" ]; then
            export DOCS_API_KEY="$LIVE_KEY"; api=()
          else
            echo "::warning::Secret SUPERTEXT_API_KEY is not set: the screenshots use the stand-in API's translations."
            api=(-e SUPERTEXT_API_ENDPOINT=http://127.0.0.1:8765/v1/)
          fi
          docker run -d --name demo-docs --network host \
            -e PORT=8082 -e PRESTASHOP_DOMAIN=localhost:8082 -e DATABASE_URL -e PRESTASHOP_DB_NAME=prestashop_docs \
            "${api[@]}" \
            -e SUPERTEXT_REPORT_URL=http://127.0.0.1:8765/report \
            -e DEMO_ADMIN_EMAIL -e DEMO_ADMIN_PASSWORD -e DEMO_EDITOR_EMAIL -e DEMO_EDITOR_PASSWORD \
            supertext-prestashop-demo
          # First start: PrestaShop's installer, then demo/setup.php; Apache starts after that.
          for _ in $(seq 1 180); do
            if curl -fsS -o /dev/null "$DOCS_URL/health"; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' demo-docs)" != "true" ]; then docker logs demo-docs; exit 1; fi
            sleep 5
          done
          curl -fsS -o /dev/null "$DOCS_URL/health" || { docker logs demo-docs; exit 1; }
          cd tests/docs
          BASE_URL="$DOCS_URL/admin-dev" node screenshots.mjs

      - name: Did the screenshots change?
        id: images
        if: (success() || failure()) && steps.shots.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain docs/images)" ]; then
            git status --short docs/images
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the screenshots
        if: steps.images.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-images
          path: docs/images/

      - name: Collect logs for debugging
        if: failure()
        run: |
          mkdir -p e2e-debug
          cp -r tests/e2e/artifacts e2e-debug/ 2>/dev/null || true
          cp tests/docs/stand-in.log e2e-debug/ 2>/dev/null || true
          for c in demo-live demo-docs; do docker logs "$c" > "e2e-debug/$c.log" 2>&1 || true; done
          for c in demo-live demo-docs; do docker exec "$c" sh -c 'tail -n 300 /var/www/html/var/logs/*.log' > "e2e-debug/$c-prestashop.log" 2>&1 || true; done

      - name: Upload logs for debugging
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-debug
          path: e2e-debug/
          retention-days: 7

  screenshots-commit:
    name: Commit the new screenshots
    needs: e2e
    if: needs.e2e.outputs.images-changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 20
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-images
          path: docs/images/

      # Straight to main, no pull request to review: the images come from the E2E run, and a push
      # with the workflow's own token starts no other workflow. See "End-to-end tests" in docs/DEVELOPER.md.
      - name: Commit the images to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images
          if git diff --cached --quiet; then
            echo "The screenshots on main are already up to date."
            exit 0
          fi
          git commit -q -m "Docs: regenerate screenshots" -m "Made by the E2E workflow: $RUN_URL"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3; do
            if git push -q "$remote" HEAD:main; then exit 0; fi
            echo "main moved on (attempt $attempt): rebasing the screenshot commit"
            git pull -q --rebase "$remote" main
          done
          exit 1
